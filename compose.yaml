services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: fishstack
      MYSQL_USER: fishstack
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-fishstack_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-fishstack_root_dev}
    ports:
      - "3307:3306"
    volumes:
      - fishstack_mysql:/var/lib/mysql
      - ./Proyecto/Api/DB/fishstack.sql:/docker-entrypoint-initdb.d/01-fishstack.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u fishstack -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build:
      context: ./Proyecto/Api
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: fishstack
      DB_USER: fishstack
      DB_PASSWORD: ${MYSQL_PASSWORD:-fishstack_dev}
      JWT_SECRET: ${JWT_SECRET:-fishstack_jwt_dev}
      CLIENT_ORIGIN: http://localhost:5173
    ports:
      - "3000:3000"
    volumes:
      - ./Proyecto/Api:/app
      - api_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ./Proyecto/Client
    environment:
      VITE_API_URL: http://localhost:3000
      GAME_BUILD_DIR: /game-alpha
    ports:
      - "5173:5173"
    volumes:
      - ./Proyecto/Client:/app
      - ./Juego/FishStackFFWeb:/game-alpha:ro
      - client_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  fishstack_mysql:
  api_node_modules:
  client_node_modules:
